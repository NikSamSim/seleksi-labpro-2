services:
  primary-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PRIMARY_DB_USER}
      POSTGRES_PASSWORD: ${PRIMARY_DB_PASSWORD}
      POSTGRES_DB: ${PRIMARY_DB_NAME}
    ports:
      - "${PRIMARY_DB_PORT}:5432"
    volumes:
      - primary-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRIMARY_DB_USER} -d ${PRIMARY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app-a-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${APP_A_DB_USER}
      POSTGRES_PASSWORD: ${APP_A_DB_PASSWORD}
      POSTGRES_DB: ${APP_A_DB_NAME}
    ports:
      - "${APP_A_DB_PORT}:5432"
    volumes:
      - app-a-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_A_DB_USER} -d ${APP_A_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app-b-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${APP_B_DB_USER}
      POSTGRES_PASSWORD: ${APP_B_DB_PASSWORD}
      POSTGRES_DB: ${APP_B_DB_NAME}
    ports:
      - "${APP_B_DB_PORT}:5432"
    volumes:
      - app-b-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_B_DB_USER} -d ${APP_B_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  auth-server:
    build:
      context: .
      dockerfile: auth-provider/server/Dockerfile
    stop_grace_period: 15s
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}

      PRIMARY_DATABASE_URL: postgresql://${PRIMARY_DB_USER}:${PRIMARY_DB_PASSWORD}@primary-db:5432/${PRIMARY_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PROMETHEUS_URL: http://prometheus:9090

      CONTROL_PANEL_ORIGIN: ${CONTROL_PANEL_ORIGIN}

      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME}
      SSO_SESSION_TTL_SECONDS: ${SSO_SESSION_TTL_SECONDS}

      AUTHORIZATION_CODE_TTL_SECONDS: ${AUTHORIZATION_CODE_TTL_SECONDS}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}

      APP_A_CLIENT_ID: ${APP_A_CLIENT_ID}
      APP_A_CLIENT_SECRET: ${APP_A_CLIENT_SECRET}
      APP_A_REDIRECT_URI: ${APP_A_REDIRECT_URI}
      APP_A_LAUNCH_URL: ${APP_A_LAUNCH_URL}
      APP_A_LOGOUT_NOTIFICATION_URL: ${APP_A_LOGOUT_NOTIFICATION_URL}

      APP_B_CLIENT_ID: ${APP_B_CLIENT_ID}
      APP_B_CLIENT_SECRET: ${APP_B_CLIENT_SECRET}
      APP_B_REDIRECT_URI: ${APP_B_REDIRECT_URI}
      APP_B_LAUNCH_URL: ${APP_B_LAUNCH_URL}
      APP_B_LOGOUT_NOTIFICATION_URL: ${APP_B_LOGOUT_NOTIFICATION_URL}

      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}

      MFA_ISSUER: ${MFA_ISSUER}
      MFA_PENDING_COOKIE_NAME: ${MFA_PENDING_COOKIE_NAME}
      MFA_CHALLENGE_TTL_SECONDS: ${MFA_CHALLENGE_TTL_SECONDS}
      MFA_RECENT_VERIFICATION_SECONDS: ${MFA_RECENT_VERIFICATION_SECONDS:-600}
      MFA_ENROLLMENT_TTL_SECONDS: ${MFA_ENROLLMENT_TTL_SECONDS:-600}
      MFA_ENCRYPTION_KEY_BASE64: ${MFA_ENCRYPTION_KEY_BASE64}
    ports:
      - "${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}"
    depends_on:
      primary-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sync-worker:
    build:
      context: .
      dockerfile: auth-provider/sync-worker/Dockerfile
    stop_grace_period: 15s
    environment:
      NODE_ENV: ${NODE_ENV}
      SYNC_WORKER_PORT: ${SYNC_WORKER_PORT}
      PRIMARY_DATABASE_URL: postgresql://${PRIMARY_DB_USER}:${PRIMARY_DB_PASSWORD}@primary-db:5432/${PRIMARY_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SYNC_EXCHANGE_NAME: ${SYNC_EXCHANGE_NAME}
      SYNC_MAIN_QUEUE_NAME: ${SYNC_MAIN_QUEUE_NAME}
      SYNC_MAIN_ROUTING_KEY: ${SYNC_MAIN_ROUTING_KEY}
      SYNC_DLQ_NAME: ${SYNC_DLQ_NAME}
      SYNC_DLQ_ROUTING_KEY: ${SYNC_DLQ_ROUTING_KEY}
      SYNC_RETRY_DELAYS_MS: ${SYNC_RETRY_DELAYS_MS}
      SYNC_WORKER_PREFETCH: ${SYNC_WORKER_PREFETCH}
      SYNC_WORKER_REQUEST_TIMEOUT_MS: ${SYNC_WORKER_REQUEST_TIMEOUT_MS}
      APP_A_CLIENT_ID: ${APP_A_CLIENT_ID}
      APP_A_INTERNAL_LOGOUT_SECRET: ${APP_A_INTERNAL_LOGOUT_SECRET}
      APP_B_CLIENT_ID: ${APP_B_CLIENT_ID}
      APP_B_INTERNAL_LOGOUT_SECRET: ${APP_B_INTERNAL_LOGOUT_SECRET}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    ports:
      - "${SYNC_WORKER_PORT}:${SYNC_WORKER_PORT}"
    depends_on:
      primary-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-publisher:
    build:
      context: .
      dockerfile: auth-provider/event-publisher/Dockerfile
    stop_grace_period: 15s
    environment:
      NODE_ENV: ${NODE_ENV}
      EVENT_PUBLISHER_PORT: ${EVENT_PUBLISHER_PORT}
      PRIMARY_DATABASE_URL: postgresql://${PRIMARY_DB_USER}:${PRIMARY_DB_PASSWORD}@primary-db:5432/${PRIMARY_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SYNC_EXCHANGE_NAME: ${SYNC_EXCHANGE_NAME}
      SYNC_MAIN_QUEUE_NAME: ${SYNC_MAIN_QUEUE_NAME}
      SYNC_MAIN_ROUTING_KEY: ${SYNC_MAIN_ROUTING_KEY}
      SYNC_DLQ_NAME: ${SYNC_DLQ_NAME}
      SYNC_DLQ_ROUTING_KEY: ${SYNC_DLQ_ROUTING_KEY}
      SYNC_RETRY_DELAYS_MS: ${SYNC_RETRY_DELAYS_MS}
      EVENT_PUBLISHER_POLL_INTERVAL_MS: ${EVENT_PUBLISHER_POLL_INTERVAL_MS}
      EVENT_PUBLISHER_BATCH_SIZE: ${EVENT_PUBLISHER_BATCH_SIZE}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    ports:
      - "${EVENT_PUBLISHER_PORT}:${EVENT_PUBLISHER_PORT}"
    depends_on:
      primary-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  app-a:
    build:
      context: .
      dockerfile: applications/app-a/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_A_PORT: ${APP_A_PORT}
      APP_A_DATABASE_URL: postgresql://${APP_A_DB_USER}:${APP_A_DB_PASSWORD}@app-a-db:5432/${APP_A_DB_NAME}

      AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_PUBLIC_URL}
      AUTH_SERVER_INTERNAL_URL: http://auth-server:3000
      AUTH_SERVER_REQUEST_TIMEOUT_MS: ${AUTH_SERVER_REQUEST_TIMEOUT_MS}

      APP_A_CLIENT_ID: ${APP_A_CLIENT_ID}
      APP_A_CLIENT_SECRET: ${APP_A_CLIENT_SECRET}
      APP_A_REDIRECT_URI: ${APP_A_REDIRECT_URI}

      APP_A_COOKIE_NAME: ${APP_A_COOKIE_NAME}
      APP_A_SESSION_TTL_SECONDS: ${APP_A_SESSION_TTL_SECONDS}
      APP_A_OAUTH_TRANSACTION_TTL_SECONDS: ${APP_A_OAUTH_TRANSACTION_TTL_SECONDS}
      APP_A_INTERNAL_LOGOUT_SECRET: ${APP_A_INTERNAL_LOGOUT_SECRET}
    ports:
      - "${APP_A_PORT}:${APP_A_PORT}"
    depends_on:
      app-a-db:
        condition: service_healthy

  app-b:
    build:
      context: .
      dockerfile: applications/app-b/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_B_PORT: ${APP_B_PORT}
      APP_B_DATABASE_URL: postgresql://${APP_B_DB_USER}:${APP_B_DB_PASSWORD}@app-b-db:5432/${APP_B_DB_NAME}

      AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_PUBLIC_URL}
      AUTH_SERVER_INTERNAL_URL: http://auth-server:3000
      AUTH_SERVER_REQUEST_TIMEOUT_MS: ${AUTH_SERVER_REQUEST_TIMEOUT_MS}

      APP_B_CLIENT_ID: ${APP_B_CLIENT_ID}
      APP_B_CLIENT_SECRET: ${APP_B_CLIENT_SECRET}
      APP_B_REDIRECT_URI: ${APP_B_REDIRECT_URI}

      APP_B_COOKIE_NAME: ${APP_B_COOKIE_NAME}
      APP_B_SESSION_TTL_SECONDS: ${APP_B_SESSION_TTL_SECONDS}
      APP_B_OAUTH_TRANSACTION_TTL_SECONDS: ${APP_B_OAUTH_TRANSACTION_TTL_SECONDS}
      APP_B_INTERNAL_LOGOUT_SECRET: ${APP_B_INTERNAL_LOGOUT_SECRET}
    ports:
      - "${APP_B_PORT}:${APP_B_PORT}"
    depends_on:
      app-b-db:
        condition: service_healthy

  control-panel:
    build:
      context: .
      dockerfile: auth-provider/control-panel/Dockerfile
    environment:
      CONTROL_PANEL_PORT: ${CONTROL_PANEL_PORT}
    ports:
      - "${CONTROL_PANEL_PORT}:${CONTROL_PANEL_PORT}"

volumes:
  primary-db-data:
  app-a-db-data:
  app-b-db-data:
  rabbitmq-data:
  prometheus-data: