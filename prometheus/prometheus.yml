global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: auth-server
    static_configs:
      - targets:
          - auth-server:3000

  - job_name: app-a
    static_configs:
      - targets:
          - app-a:4000

  - job_name: app-b
    static_configs:
      - targets:
          - app-b:4001

  - job_name: sync-worker
    static_configs:
      - targets:
          - sync-worker:5000

  - job_name: event-publisher
    static_configs:
      - targets:
          - event-publisher:5001